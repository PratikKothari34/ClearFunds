<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearFunds</title>
    <meta
      name="description"
      content="The society ledger every resident can read. Append-only, approved by more than one person, and checkable against a record published outside the committee's control."
    />

    <!--
      THE POLICY THE HASH IS FOR.

      The comment on the inline script below said the server must allow it
      by SHA-256 hash in the CSP, and no CSP existed anywhere - a dead
      check that read as a live one. `theme.inline.test.ts` even asserted
      the script is the only inline one "so one CSP hash covers the app",
      which was true of a policy that was not there.

      WHAT A META TAG CANNOT DO, and it is the important half:
      `frame-ancestors` is IGNORED in a meta tag and must be a response
      header. It is the clickjacking defence, and clickjacking is the one
      web attack a hash chain cannot detect after the fact: a transparent
      overlay on the Approve button produces a correctly authenticated,
      correctly signed approval that is indistinguishable in the chain from
      a deliberate one. The header list is in the backend contract.

      `connect-src` names the anchor host because the published chain head
      is fetched from a host outside the committee's control. It is listed
      here so adding a second origin is a visible change.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-NuAThATVjaaF19uzh1hbfv6Hp+EVbvHjj5dqyPXlSe0='; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'"
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />

    <!--
      The Latin subset is preloaded; Devanagari deliberately is not, and is
      fetched by the i18n layer only on a locale that needs it.

      Only the two faces the first screen actually uses are listed. A
      preload for a font the first paint does not need competes with the
      ledger payload for the same connection, and Chrome warns about it.
      400 is the body and 500 is the balance figure.
    -->
    <link
      rel="preload"
      href="/fonts/source-sans-3-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-sans-3-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Theme applied before first paint. This must stay inline and must stay
      in <head>: deferred to a module it runs after the first paint and a
      dark-mode resident gets a white flash on every load.

      It is therefore the one inline script in the app, and the server must
      allow it by SHA-256 hash in the CSP, never with 'unsafe-inline'.
      Changing a single character of it changes the hash and the script will
      be blocked, so the hash is regenerated by `npm run csp-hash` and the
      value is in the backend contract.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cf-theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {
          /* Private mode or blocked storage: fall through to the OS
             preference, which the stylesheet already handles. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      ClearFunds needs JavaScript to show the ledger. The society office can
      print the current statement for you.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
